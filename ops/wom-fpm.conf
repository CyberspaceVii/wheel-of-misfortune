; Wheel of Misfortune API (template: ./deploy.sh config fills the @…@ values). One script only:
; @APP@/api.php, reached at @URL@/api/ (apache-wom.conf). Its own user; writes only @DATA@.
; No exec: sound transcodes and Piper voice lines are queued for wom-worker.service.
[wom]
user = wom
group = wom
listen = @SOCK@
listen.owner = @WEB_USER@
listen.group = @WEB_USER@
listen.mode = 0660
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 30s
pm.max_requests = 200
request_terminate_timeout = 40s
security.limit_extensions = .php
env[WOM_DATA] = @DATA@
php_admin_value[open_basedir] = @APP@/:@DATA@/:/tmp/
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[sys_temp_dir] = /tmp
php_admin_flag[file_uploads] = on
php_admin_value[max_file_uploads] = 1
php_admin_value[gd.jpeg_ignore_warning] = 0
php_admin_value[upload_max_filesize] = 15M
php_admin_value[post_max_size] = 16M
php_admin_value[max_input_vars] = 20
php_admin_value[max_input_time] = 30
php_admin_value[max_execution_time] = 30
; one 40 MP decode (4 bytes a pixel) plus the scaled copy
php_admin_value[memory_limit] = 256M
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_value[session.auto_start] = 0
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,dl,mail,putenv,proc_nice,posix_kill,posix_setuid,posix_setgid,posix_mkfifo,link,symlink,chown,chgrp,lchown,lchgrp,fsockopen,pfsockopen,curl_exec,curl_multi_exec
