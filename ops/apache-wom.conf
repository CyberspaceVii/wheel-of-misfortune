    # ---- Wheel of Misfortune (template: ./deploy.sh config fills the @…@ values from deploy.conf) ----
    # Goes inside the site's <VirtualHost>. One shared set of wheels that anyone can play and edit.
    # api.php rate-limits per IP (keyed hashes only) and caps wheels, uploads and the voice queue.
    # With ModSecurity + OWASP CRS, rule 200004 false-positives on binary uploads: exempt it on
    # @URL@/api/upload only.
    # the game page and its files: same-origin only, no inline script or style (none is used)
    <Directory "@WEBROOT@">
        Options None
        AllowOverride None
        Require all granted
        Header always set X-Robots-Tag "noindex, nofollow, noarchive"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'; object-src 'none'"
    </Directory>
    <Location "@URL@/api/">
        ProxyPass "unix:@SOCK@|fcgi://wom@APP@/api.php"
        ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "@APP@/api.php"
        LimitRequestBody 16777216
        <IfModule security2_module>
            SecRequestBodyInMemoryLimit 16777216
        </IfModule>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'"
    </Location>
    # uploaded images/sounds + Piper voice lines (random/sha names, written only by the wom user)
    Alias "@URL@/media/" "@DATA@/media/"
    <Directory "@DATA@/media">
        Options None
        AllowOverride None
        Require all granted
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Robots-Tag "noindex, nofollow, noarchive"
        Header always set Content-Security-Policy "default-src 'none'; sandbox"
    </Directory>
